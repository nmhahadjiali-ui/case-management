<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>CaseFlow — No connection</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f8fa; --card: #fff; --fg: #1a1a1a; --muted: #6b7280; --border: #e5e7eb; --primary: #234c88; }
    @media (prefers-color-scheme: dark) { :root { --bg: #15171c; --card: #1d2027; --fg: #f5f5f5; --muted: #a1a1aa; --border: #2e323b; --primary: #8fb0e6; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; padding: 24px; }
    .card { width: min(440px, 100%); background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 20px; margin: 16px 0 4px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button { background: var(--primary); color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer; }
    @media (prefers-color-scheme: dark) { button { color: #15171c; } }
    small { display: block; margin-top: 16px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="build/icon.png" alt="" />
    <h1>Can't reach CaseFlow</h1>
    <p>Check your internet connection. CaseFlow will reconnect automatically when you're back online.</p>
    <button id="retry" type="button">Retry</button>
    <small id="reason"></small>
  </main>
  <script>
    const params = new URLSearchParams(location.search)
    const url = params.get("url")
    document.getElementById("reason").textContent = params.get("reason") || ""
    const retry = () => url && location.replace(url)
    document.getElementById("retry").addEventListener("click", retry)
    window.addEventListener("online", retry)
  </script>
</body>
</html>
